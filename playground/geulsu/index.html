<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex" />

  <title>글자수 세기 &ndash; LIM YESUNG</title>
  <meta name="description" content="한글 글자수 카운터. 점자정보단말기 접근성 지원." />

  <link rel="canonical" href="https://imyesung.github.io/playground/geulsu/" />
  <link rel="stylesheet" href="../../style.css" />

  <style>
    .tool-area {
      margin-top: 1.5rem;
    }

    .tool-area label {
      display: block;
      font-weight: 600;
      margin-bottom: 0.25rem;
    }

    .tool-area textarea {
      width: 100%;
      min-height: 40vh;
      padding: 0.75rem;
      font-family: inherit;
      font-size: 1rem;
      line-height: 1.8;
      border: 1px solid #d0d0d0;
      border-radius: 0;
      background: #ffffff;
      color: #111111;
      resize: vertical;
    }

    .tool-area textarea:focus {
      outline: 2px solid #0066cc;
      outline-offset: 1px;
    }

    .tool-actions {
      margin-top: 0.75rem;
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .tool-actions button {
      padding: 0.5rem 1rem;
      font-family: inherit;
      font-size: 0.875rem;
      border: 1px solid #d0d0d0;
      border-radius: 0;
      background: #ffffff;
      color: #111111;
      cursor: pointer;
    }

    .tool-actions button:hover {
      background: #111111;
      color: #ffffff;
      border-color: #111111;
    }

    .tool-actions button:focus {
      outline: 2px solid #0066cc;
      outline-offset: 1px;
    }

    .tool-result {
      margin-top: 0.75rem;
      padding: 0.75rem;
      font-size: 1rem;
      font-weight: 600;
      border: 1px solid #d0d0d0;
      background: #fafafa;
    }

    .tool-result:focus {
      outline: 2px solid #0066cc;
      outline-offset: 1px;
    }

    .visual-stats {
      margin-top: 1.5rem;
      padding-top: 1rem;
      border-top: 1px solid #d0d0d0;
      display: flex;
      flex-wrap: wrap;
      gap: 0.25rem 1.5rem;
      font-size: 0.875rem;
      color: #666666;
    }

    .stat-pair {
      white-space: nowrap;
    }

    .visual-stats dt {
      display: inline;
    }

    .visual-stats dd {
      display: inline;
      margin: 0;
      font-weight: 600;
      color: #111111;
    }
  </style>
</head>
<body class="page-playground">
  <div class="page-wrap">

    <header class="site-header">
      <div class="site-header-inner">
        <div class="logo-block">
          <a href="../../index.html" class="logo-text">LIM YESUNG</a>
        </div>
        <nav class="site-nav">
          <a href="../../index.html">About</a>
          <a href="../../filmography.html">Filmography</a>
          <a href="../../blackboard.html">Blackboard</a>
          <a href="../../playground.html" class="nav-current">Playground</a>
        </nav>
      </div>
    </header>

    <main class="site-main">
      <section class="section">
        <div class="section-inner">
          <h1>글자수 세기</h1>

          <div class="tool-area">
            <label for="editor">텍스트 입력</label>
            <textarea id="editor" placeholder="여기에 텍스트를 입력하거나 붙여넣으세요"></textarea>

            <div class="tool-actions">
              <button type="button" id="btnCount">글자수 확인</button>
              <button type="button" id="btnAlert">글자수 알림</button>
              <button type="button" id="btnClear">전체 지우기</button>
            </div>

            <p class="tool-result" id="result" tabindex="-1" role="status" aria-live="polite" aria-atomic="true">공백 포함 0자 / 공백 제외 0자</p>
          </div>

          <dl class="visual-stats" aria-hidden="true">
            <div class="stat-pair"><dt>공백 포함</dt> <dd id="vWithSpace">0</dd></div>
            <div class="stat-pair"><dt>공백 제외</dt> <dd id="vNoSpace">0</dd></div>
            <div class="stat-pair"><dt>낱말</dt> <dd id="vWords">0</dd></div>
            <div class="stat-pair"><dt>줄</dt> <dd id="vLines">0</dd></div>
            <div class="stat-pair"><dt>원고지(200자)</dt> <dd id="vManuscript">0매</dd></div>
          </dl>

        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="site-footer-inner">
        <span>&copy; 2026</span>
        <span>limyesung</span>
        <a href="https://github.com/imyesung" class="footer-github" aria-label="GitHub">
          <svg class="github-icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
        </a>
      </div>
    </footer>

  </div>

<script>
var editor = document.getElementById('editor');
var result = document.getElementById('result');
var btnCount = document.getElementById('btnCount');
var btnAlert = document.getElementById('btnAlert');
var btnClear = document.getElementById('btnClear');

var vWithSpace = document.getElementById('vWithSpace');
var vNoSpace = document.getElementById('vNoSpace');
var vWords = document.getElementById('vWords');
var vLines = document.getElementById('vLines');
var vManuscript = document.getElementById('vManuscript');

function getStats(text) {
  var withSpace = text.length;
  var noSpace = text.replace(/\s/g, '').length;
  var trimmed = text.trim();
  var words = trimmed ? trimmed.split(/\s+/).length : 0;
  var lines = text ? text.split('\n').length : 0;
  var manuscript = Math.ceil(withSpace / 200) || 0;
  return {
    withSpace: withSpace,
    noSpace: noSpace,
    words: words,
    lines: lines,
    manuscript: manuscript
  };
}

function updateVisualStats() {
  var s = getStats(editor.value);
  vWithSpace.textContent = s.withSpace.toLocaleString();
  vNoSpace.textContent = s.noSpace.toLocaleString();
  vWords.textContent = s.words.toLocaleString();
  vLines.textContent = s.lines.toLocaleString();
  vManuscript.textContent = s.manuscript.toLocaleString() + '매';
}

// 타이핑 멈추고 0.5초 후 aria-live 영역 자동 갱신 → TTS가 읽어줌
var debounceTimer = null;

function updateLiveResult() {
  var s = getStats(editor.value);
  result.textContent = '공백 포함 ' + s.withSpace + '자 / 공백 제외 ' + s.noSpace + '자';
}

editor.addEventListener('input', function() {
  updateVisualStats();
  clearTimeout(debounceTimer);
  debounceTimer = setTimeout(updateLiveResult, 500);
});

// 글자수 확인: 상세 결과 + 포커스 이동 → 점자 디스플레이에 표시
btnCount.addEventListener('click', function() {
  clearTimeout(debounceTimer);
  var s = getStats(editor.value);
  result.textContent =
    '공백포함 ' + s.withSpace + '자, ' +
    '공백제외 ' + s.noSpace + '자, ' +
    s.lines + '줄, ' +
    '원고지 ' + s.manuscript + '매';
  result.focus();
});

btnAlert.addEventListener('click', function() {
  var s = getStats(editor.value);
  alert(
    '공백포함 ' + s.withSpace + '자\n' +
    '공백제외 ' + s.noSpace + '자\n' +
    s.lines + '줄\n' +
    '원고지 ' + s.manuscript + '매'
  );
});

btnClear.addEventListener('click', function() {
  editor.value = '';
  updateVisualStats();
  result.textContent = '내용을 모두 지웠습니다';
  result.focus();
  setTimeout(function() { editor.focus(); }, 1500);
});

updateVisualStats();
</script>
</body>
</html>
